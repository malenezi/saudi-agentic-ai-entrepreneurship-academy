<html lang="ar" dir="rtl">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- theme tokens: Najdi slate, Riyadh sandstone, off-white ---------- */
:root {
  --bg: #f8fafc; --ink: #1e293b; --muted: #475569; --line: #e2e8f0; --card: #ffffff;
  --accent: #d97706; --accent-ink: #b45309; --accent-soft: #fef3c7;
  --gold-dark: #f59e0b; --on-dark: #f8fafc; --muted-dark: #cbd5e1;
  --good: #15803d; --good-soft: #dcfce7; --bad: #b91c1c; --bad-soft: #fee2e2; --info-soft: #e0e7ff; --info: #3730a3;
  --font-ar: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-en: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --display-ar: "Noto Kufi Arabic", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --dir: 1; --scale: 1;
}
[dir="rtl"] { --dir: -1; }

/* ---------- engine: a 1600x900 stage scaled to the window ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; block-size: 100%; background: #0f172a; overflow: hidden; }
.deck { position: fixed; inset: 0; }
.slide {
  /* Centred with physical offsets on purpose: the stage sits in the middle in both directions. */
  position: absolute; top: 50%; left: 50%; margin: -450px 0 0 -800px;
  inline-size: 1600px; block-size: 900px;
  background: var(--bg); color: var(--ink); padding: 76px 104px 84px;
  display: flex; flex-direction: column; justify-content: center; overflow: hidden;
  --shift: 60px; opacity: 0; visibility: hidden;
  transform: translateX(calc(var(--dir) * var(--shift))) scale(var(--scale));
  transition: opacity .5s ease, transform .65s cubic-bezier(.2, .7, .2, 1), visibility 0s .5s;
}
.slide.is-past { --shift: -60px; }
.slide.is-active { --shift: 0px; opacity: 1; visibility: visible; transition-delay: 0s; }
[data-step] { opacity: 0; transform: translateY(16px); transition: opacity .45s, transform .45s; }
[data-step].is-shown { opacity: 1; transform: none; }

.progress { position: fixed; inset-block-end: 0; inset-inline: 0; block-size: 4px; background: rgb(255 255 255 / .12); z-index: 5; }
.progress i { display: block; block-size: 100%; inline-size: 0; background: var(--accent); transition: inline-size .4s; }
.counter { position: fixed; inset-block-end: 14px; inset-inline-end: 20px; z-index: 5; color: #94a3b8; font: 500 13px var(--font-en); }
.notes-panel { position: fixed; inset-inline: 0; inset-block-end: 0; z-index: 6; background: rgb(15 23 42 / .95); color: #e2e8f0; padding: 18px 28px 26px; font: 20px/1.8 var(--font-ar); max-block-size: 36vh; overflow: auto; display: none; }
.show-notes .notes-panel { display: block; }
.sr-only { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- type ---------- */
body { font-size: 30px; font-family: var(--font-ar); line-height: 1.75; }
[lang="en"] { font-family: var(--font-en); line-height: 1.45; }
h1, h2, h3, p, ul, ol { margin: 0; }
h1, h2, h3 { font-family: var(--display-ar); line-height: 1.45; font-weight: 700; }
h1, h2 { text-wrap: balance; }
h1 { font-size: 80px; }
h2 { font-size: 50px; max-inline-size: 32ch; }
h3 { font-size: 34px; font-weight: 700; line-height: 1.5; }
.en { font-family: var(--font-en); font-weight: 500; }
.kicker { color: var(--accent-ink); font-weight: 600; font-size: 28px; margin-block-end: 14px; display: flex; align-items: center; gap: 14px; }
.kicker::before { content: ""; inline-size: 44px; block-size: 3px; background: var(--accent); }
.muted { color: var(--muted); }
.num { font-family: var(--font-en); font-weight: 700; font-variant-numeric: tabular-nums; }
.lead { font-size: 32px; color: var(--muted); margin-block-start: 22px; max-inline-size: 48ch; }
.source { position: absolute; inset-block-end: 34px; inset-inline-start: 104px; inset-inline-end: 200px; font-size: 20px; color: var(--muted); line-height: 1.6; }
.modtag { position: absolute; inset-block-start: 34px; inset-inline-end: 104px; font-size: 20px; color: var(--muted); font-weight: 600; }
.badge { position: absolute; inset-block-start: 30px; inset-inline-start: 104px; font-size: 20px; font-weight: 700; padding: 4px 16px; border-radius: 999px; line-height: 1.6; }
.badge.case { background: var(--good-soft); color: var(--good); }
.badge.illus { background: var(--accent-soft); color: var(--accent-ink); }
.badge.hyp { background: var(--info-soft); color: var(--info); }
.tag { display: inline-block; font-size: 22px; font-weight: 700; padding: 2px 14px; border-radius: 999px; line-height: 1.6; background: var(--accent-soft); color: var(--accent-ink); }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.info { background: var(--info-soft); color: var(--info); }
mark { background: none; color: var(--accent-ink); }

/* ---------- title and section slides (dark) ---------- */
.slide.dark { background: var(--ink); color: var(--on-dark); }
.slide.dark .kicker { color: var(--gold-dark); }
.slide.dark .muted, .slide.dark .lead { color: var(--muted-dark); }
.slide.dark mark { color: var(--gold-dark); }
.slide.dark .modtag { color: var(--muted-dark); }
.slide[data-layout="title"] { justify-content: flex-end; padding-block-end: 110px; }
.slide[data-layout="title"] h1 { max-inline-size: 15ch; }
.slide[data-layout="title"] .sub { font-size: 34px; color: var(--muted-dark); margin-block-start: 18px; max-inline-size: 36ch; }
.slide[data-layout="title"] .meta { margin-block-start: 40px; display: flex; flex-wrap: wrap; gap: 18px 44px; color: var(--muted-dark); font-size: 26px; }
.slide[data-layout="title"] .meta b { color: var(--on-dark); font-weight: 600; }
.motif { position: absolute; inset-block-start: 0; inset-inline-end: 0; inline-size: 760px; block-size: 520px; pointer-events: none; }
.motif svg { inline-size: 100%; block-size: 100%; }
[dir="rtl"] .motif svg { transform: scaleX(-1); }

.slide[data-layout="statement"] h2 { font-size: 72px; max-inline-size: 22ch; }
.slide[data-layout="statement"] .lead { font-size: 34px; }

/* ---------- content layouts ---------- */
.split { display: grid; grid-template-columns: 1fr 1.15fr; gap: 72px; align-items: center; }
.points { list-style: none; padding: 0; display: grid; gap: 30px; }
.points li { padding-inline-start: 28px; border-inline-start: 5px solid var(--accent); }
.points li p { color: var(--muted); font-size: 28px; }

.cards { display: grid; gap: 26px; margin-block-start: 40px; }
.cards.c2 { grid-template-columns: repeat(2, 1fr); }
.cards.c3 { grid-template-columns: repeat(3, 1fr); }
.cards.c4 { grid-template-columns: repeat(4, 1fr); }
.cards > div { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px 30px; border-block-start: 6px solid var(--accent); }
.cards > div.alt { border-block-start-color: var(--ink); }
.cards > div.bad { border-block-start-color: var(--bad); }
.cards > div.good { border-block-start-color: var(--good); }
.cards h3 { font-size: 32px; margin-block-end: 8px; }
.cards p, .cards li { font-size: 28px; color: var(--muted); }
.cards ul { padding-inline-start: 1em; display: grid; gap: 6px; }
.cards .big { display: block; font: 700 64px/1.3 var(--font-en); color: var(--ink); margin-block-end: 6px; }
.slide.dark .cards > div { background: rgb(255 255 255 / .06); border-color: rgb(255 255 255 / .14); }
.slide.dark .cards p { color: var(--muted-dark); }

.tbl { inline-size: 100%; border-collapse: collapse; margin-block-start: 28px; font-size: 28px; line-height: 1.55; }
.tbl th { text-align: start; font-weight: 700; color: var(--muted); font-size: 24px; padding: 10px 18px; border-block-end: 3px solid var(--ink); }
.tbl td { padding: 9px 18px; border-block-end: 1px solid var(--line); vertical-align: top; }
.tbl td.n, .tbl th.n { text-align: end; font-family: var(--font-en); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.hot td { background: var(--accent-soft); }
.tbl tr.loss td.n { color: var(--bad); font-weight: 700; }
.tbl tr.total td { font-weight: 700; border-block-start: 3px solid var(--ink); }

.flow { list-style: none; padding: 0; margin-block-start: 48px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 44px; counter-reset: step; }
.flow li { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 22px 24px; counter-increment: step; font-size: 27px; line-height: 1.55; }
.flow li::before { content: counter(step); display: block; font: 700 30px var(--font-en); color: var(--accent); margin-block-end: 6px; }
.flow li b { display: block; font-size: 28px; margin-block-end: 4px; }
.flow li small { display: block; color: var(--muted); font-size: 24px; }
/* Arrow between steps: sits in the gap at the inline end and mirrors with reading direction. */
.flow li:not(:last-child)::after { content: ""; position: absolute; inset-block-start: 50%; inset-inline-end: -36px; inline-size: 26px; block-size: 26px; margin-block-start: -13px;
  background: var(--accent); clip-path: polygon(0 0, 100% 50%, 0 100%); transform: scaleX(var(--dir)); }
.flow li.human { border-color: var(--ink); border-width: 3px; }
.flow li.human::before { color: var(--ink); }
.flow li.gate { background: var(--accent-soft); border-color: var(--accent); }

.compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 32px; align-items: stretch; margin-block-start: 40px; }
.compare > div { border-radius: 20px; padding: 36px 40px; border: 1px solid var(--line); background: var(--card); }
.compare > div.to { background: var(--ink); color: var(--on-dark); border-color: var(--ink); }
.compare ul { margin-block-start: 14px; padding-inline-start: 1.1em; display: grid; gap: 12px; font-size: 29px; }
.compare .arrow { align-self: center; inline-size: 60px; block-size: 60px; color: var(--accent); transform: scaleX(var(--dir)); }

.chat { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; margin-block-start: 26px; }
.chat > div { border-radius: 20px; padding: 18px 24px; background: var(--card); border: 1px solid var(--line); display: grid; gap: 8px; align-content: start; }
.chat > div.bad { border-block-start: 6px solid var(--bad); }
.chat > div.good { border-block-start: 6px solid var(--good); }
.chat h3 { font-size: 30px; }
.bubble { font-size: 28px; line-height: 1.55; padding: 8px 18px; border-radius: 16px; max-inline-size: 92%; }
.bubble.q { background: #f1f5f9; justify-self: start; border-start-start-radius: 4px; }
.bubble.a { background: var(--accent-soft); justify-self: end; border-start-end-radius: 4px; }
.bubble i { font-style: normal; color: var(--muted); font-size: 22px; display: block; line-height: 1.6; }
.chat .verdict { font-size: 24px; color: var(--muted); border-block-start: 1px solid var(--line); padding-block-start: 8px; }

.formula { font: 500 28px/1.7 "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; background: var(--ink); color: var(--on-dark); border-radius: 18px; padding: 26px 34px; margin-block-start: 30px; white-space: pre; }
.formula b { color: var(--gold-dark); font-weight: 600; }

.ladder { list-style: none; padding: 0; margin-block-start: 44px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px; align-items: end; }
.ladder li { background: var(--card); border: 1px solid var(--line); border-radius: 16px 16px 6px 6px; padding: 16px 18px; font-size: 25px; line-height: 1.5; display: flex; flex-direction: column; justify-content: flex-end; }
.ladder li .num { font-size: 44px; color: var(--accent); line-height: 1.6; }
.ladder li:nth-child(1) { min-block-size: 150px; } .ladder li:nth-child(2) { min-block-size: 185px; } .ladder li:nth-child(3) { min-block-size: 220px; }
.ladder li:nth-child(4) { min-block-size: 255px; } .ladder li:nth-child(5) { min-block-size: 290px; } .ladder li:nth-child(6) { min-block-size: 325px; }
.ladder li.hot { background: var(--ink); color: var(--on-dark); border-color: var(--ink); }
.ladder li.hot .num { color: var(--gold-dark); }

/* Stacked time bar: grows from the inline start. */
.stack { display: flex; block-size: 64px; border-radius: 10px; overflow: hidden; margin-block-start: 18px; }
.stack span { display: flex; align-items: center; justify-content: center; font: 600 22px var(--font-en); color: #fff; inline-size: var(--w); }
.stack .t { background: var(--accent); } .stack .w { background: #94a3b8; }
.legend { display: flex; gap: 34px; margin-block-start: 14px; font-size: 24px; color: var(--muted); }
.legend i { display: inline-block; inline-size: 18px; block-size: 18px; border-radius: 4px; margin-inline-end: 8px; vertical-align: middle; }

.bars { margin-block-start: 40px; display: grid; gap: 22px; }
.bar { display: grid; grid-template-columns: 360px 1fr 150px; align-items: center; gap: 24px; font-size: 29px; }
.bar .track { block-size: 42px; background: #e2e8f0; border-radius: 8px; overflow: hidden; }
/* Bars grow with inline-size from the inline start; transform-origin is physical and would not mirror. */
.bar .fill { display: block; block-size: 100%; inline-size: 0; background: var(--ink); border-radius: 8px; transition: inline-size 1s cubic-bezier(.2, .7, .2, 1) .25s; }
.bar.hot .fill { background: var(--accent); }
.bar.bad .fill { background: var(--bad); }
.is-active .bar .fill { inline-size: var(--v); }
.bar .num { text-align: end; }

.asks { counter-reset: ask; list-style: none; padding: 0; margin-block-start: 40px; display: grid; gap: 26px; }
.asks li { counter-increment: ask; display: grid; grid-template-columns: 76px 1fr; align-items: baseline; font-size: 34px; line-height: 1.55; }
.asks li::before { content: counter(ask); font: 700 46px var(--font-en); color: var(--accent); }
.asks li small { display: block; grid-column: 2; font-size: 26px; color: var(--muted); }

.checks { list-style: none; padding: 0; display: grid; gap: 18px; margin-block-start: 36px; font-size: 29px; }
.checks li { position: relative; padding-inline-start: 50px; }
.checks li::before { content: "✓"; position: absolute; inset-inline-start: 0; font: 700 30px var(--font-en); color: var(--good); }
.checks.x li::before { content: "✕"; color: var(--bad); }
.checks.q li::before { content: "؟"; color: var(--accent-ink); font-family: var(--font-ar); }
.checks.cols2, .cols2 { display: block; columns: 2; column-gap: 64px; }
.cols2 li { break-inside: avoid; margin-block-end: 18px; }

.wf { display: grid; gap: 8px; margin-block-start: 22px; }
.wf .row { display: grid; grid-template-columns: 64px 1fr 240px; gap: 18px; align-items: center; font-size: 28px; line-height: 1.5; }
.wf .row .n { font: 700 28px var(--font-en); color: var(--accent); text-align: center; }
.wf .row .t { font-weight: 600; font-size: 26px; text-align: end; color: var(--ink); }
.wf .row.wait { color: var(--muted); }
.wf .row.wait .n { color: #94a3b8; }
.wf .row.wait .t { color: var(--muted); }
.wf .row .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 18px; }
.wf .row.rule .box { background: var(--accent-soft); border-color: var(--accent); }
.wf .row.fail .box { background: var(--bad-soft); border-color: var(--bad); }
.wf .row.wait .box { background: none; border: 0; border-inline-start: 4px dotted #94a3b8; border-radius: 0; padding-block: 0; }
.quote { font-size: 32px; line-height: 1.8; background: var(--card); border-inline-start: 6px solid var(--accent); border-start-end-radius: 16px; border-end-end-radius: 16px; padding: 26px 34px; margin-block-start: 30px; }

.icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; margin-block-start: 44px; }
.icons > div { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 26px; text-align: center; }
.icons svg { inline-size: 120px; block-size: 120px; margin-block-end: 10px; }
.icons h3 { font-size: 28px; } .icons p { font-size: 24px; color: var(--muted); }

.placeholder { border: 3px dashed var(--line); border-radius: 20px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 26px; padding: 24px; min-block-size: 300px; background: repeating-linear-gradient(135deg, #fff, #fff 18px, #f8fafc 18px, #f8fafc 36px); }

/* ---------- accessibility and output ---------- */
@media (prefers-reduced-motion: reduce) {
  .slide, [data-step], .progress i, .bar .fill { transition: none !important; }
  .slide, .slide.is-past { --shift: 0px; }
}
@media print {
  @page { size: 1600px 900px; margin: 0; }
  html, body { overflow: visible; block-size: auto; background: none; }
  .deck { position: static; }
  .slide { position: relative; top: auto; left: auto; margin: 0; transform: none; opacity: 1; visibility: visible; break-after: page; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  [data-step] { opacity: 1; transform: none; }
  .bar .fill { inline-size: var(--v); transition: none; }
  .slide:last-child { break-after: auto; }
  .progress, .counter, .notes-panel, .sr-only { display: none !important; }
}
</style>
</head>
<body>

<main class="deck" id="deck">
{{SLIDES}}
</main>

<div class="progress" aria-hidden="true"><i id="bar"></i></div>
<div class="counter" aria-hidden="true"><bdi dir="ltr" id="counter">1 / 1</bdi></div>
<div class="notes-panel" id="notes" aria-live="off"></div>
<div class="sr-only" aria-live="polite" id="live"></div>

<script>
(function () {
  var root = document.documentElement;
  var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
  var bar = document.getElementById("bar"), counter = document.getElementById("counter");
  var live = document.getElementById("live"), notes = document.getElementById("notes");
  var index = 0;

  function fit() { root.style.setProperty("--scale", Math.min(innerWidth / 1600, innerHeight / 900)); }
  function steps(slide) { return Array.prototype.slice.call(slide.querySelectorAll("[data-step]")); }
  function render() {
    slides.forEach(function (s, i) {
      s.classList.toggle("is-active", i === index);
      s.classList.toggle("is-past", i < index);
      s.setAttribute("aria-hidden", i === index ? "false" : "true");
    });
    bar.style.inlineSize = ((index + 1) / slides.length * 100) + "%";
    counter.textContent = (index + 1) + " / " + slides.length;
    var heading = slides[index].querySelector("h1, h2");
    live.textContent = heading ? heading.innerText : "";
    /* Speaker notes live in <template class="notes"> so they never render on the slide or in print. */
    var note = slides[index].querySelector("template.notes");
    notes.innerHTML = note ? note.innerHTML : "";
    if (location.hash !== "#" + (index + 1)) history.replaceState(null, "", "#" + (index + 1));
  }
  function go(i, revealAll) {
    index = Math.max(0, Math.min(slides.length - 1, i));
    steps(slides[index]).forEach(function (el) { el.classList.toggle("is-shown", !!revealAll); });
    render();
  }
  function next() {
    var hidden = steps(slides[index]).filter(function (el) { return !el.classList.contains("is-shown"); });
    if (hidden.length) hidden[0].classList.add("is-shown"); else if (index < slides.length - 1) go(index + 1, false);
  }
  function prev() {
    var shown = steps(slides[index]).filter(function (el) { return el.classList.contains("is-shown"); });
    if (shown.length) shown[shown.length - 1].classList.remove("is-shown"); else if (index > 0) go(index - 1, true);
  }

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var rtl = root.dir === "rtl", k = e.key;
    if (k === "ArrowLeft") { rtl ? next() : prev(); }
    else if (k === "ArrowRight") { rtl ? prev() : next(); }
    else if (k === " " || k === "PageDown" || k === "ArrowDown" || k === "Enter") { next(); }
    else if (k === "PageUp" || k === "ArrowUp" || k === "Backspace") { prev(); }
    else if (k === "Home") { go(0, false); }
    else if (k === "End") { go(slides.length - 1, true); }
    else if (k === "n" || k === "N") { document.body.classList.toggle("show-notes"); }
    else if (k === "p" || k === "P") { window.print(); }
    else if (k === "f" || k === "F") { document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen && root.requestFullscreen(); }
    else { return; }
    e.preventDefault();
  });

  var startX = null;
  document.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX; startX = null;
    if (Math.abs(dx) < 50) return;
    var forward = root.dir === "rtl" ? dx > 0 : dx < 0;   /* swipe towards the reading start to advance */
    forward ? next() : prev();
  }, { passive: true });
  document.addEventListener("click", function (e) { if (!e.target.closest("a, button, input, .notes-panel")) next(); });

  window.addEventListener("resize", fit);
  window.addEventListener("hashchange", function () { var n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== index) go(n - 1, true); });
  fit();
  var first = (parseInt(location.hash.slice(1), 10) || 1) - 1;
  go(first, first > 0);
})();
</script>
</body>
</html>
