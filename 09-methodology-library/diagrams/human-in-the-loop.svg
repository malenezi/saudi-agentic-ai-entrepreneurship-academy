<title id="t">الإشراف البشري: أربعة مستويات لكل فعل · Human oversight: four levels for every action</title>
<desc id="d">مخطط الإشراف البشري: كل فعل يقترحه الوكيل يمر بقاعدة في الشيفرة تحدد مستواه: A ينفّذ ويسجّل، B ينفّذ ثم يُبلّغ إنساناً، C ينتظر موافقة إنسان مسمّى، D لا ينفّذه الوكيل ويحيله.</desc>
