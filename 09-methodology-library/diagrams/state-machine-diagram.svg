<title id="t">مخطط آلة الحالات: فاتورة مورّد · State machine diagram: a supplier invoice (illustrative)</title>
<desc id="d">مخطط حالات توضيحي لفاتورة مورّد: مستلَمة، ثم قيد المطابقة، ثم مطابَقة إن لم يكن فرق أو بانتظار المحاسب إن كان فرق؛ والمحاسب يقبل فتصير مطابَقة أو يرفض فتصير مرفوضة؛ والمطابَقة تصير مدفوعة بعد الاعتماد.</desc>
