<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 788 360" width="788" height="360" role="img" aria-labelledby="t d">
<title id="t">نموذج C4: مخطط سياق النظام · C4 model: a system context diagram (illustrative)</title>
<desc id="d">مخطط سياق توضيحي: وكيل خدمة العملاء في الوسط، يسأله العميل، ويعتمد موظف الخدمة ما يحيله إليه، ويقرأ الطلبات من منصة المتجر، ويرسل نص الرسالة إلى مزوّد النموذج اللغوي، ويرسل الرد عبر قناة المراسلة.</desc>
