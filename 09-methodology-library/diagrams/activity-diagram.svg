<title id="t">مخطط النشاط: طلب استرجاع · Activity diagram: a refund request (illustrative)</title>
<desc id="d">مخطط نشاط توضيحي: يُستلم طلب الاسترجاع، ثم يُتحقق من الطلب، ثم يُسأل هل المبلغ ضمن الحدّ؛ فإن كان نفّذ الوكيل الاسترجاع، وإلا أحاله إلى الموظف، وفي الحالين يُبلَّغ العميل ويُسجَّل.</desc>
