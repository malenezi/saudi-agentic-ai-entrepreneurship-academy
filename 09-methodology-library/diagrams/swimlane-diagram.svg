<title id="t">مخطط المسارات: مطابقة فاتورة مورّد · Swimlane diagram: matching a supplier invoice (illustrative)</title>
<desc id="d">مخطط مسارات توضيحي بأربعة مسارات: المورّد يرسل الفاتورة، والوكيل يستخرج بنودها ويطابقها بأمر الشراء، فإن لم يكن فرق سُجّلت مطابَقة، وإن كان فرق بتّ فيه المحاسب واعتمد الدفع، والنظام المحاسبي يسجّل.</desc>
