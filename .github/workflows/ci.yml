name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Pinned: Python 3.9 is not published for the Ubuntu 26.04 runner image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Links, anchors and tables
        run: python tools/check_repo.py
      - name: Script tests
        run: python -m unittest discover -s tests -v
